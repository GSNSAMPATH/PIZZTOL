name: Deploy Pizztol to Lightsail

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ${{ github.repository_owner }}/pizztol-web
  MIGRATOR_IMAGE: ${{ github.repository_owner }}/pizztol-migrator


jobs:

  # =====================================================
  # BUILD & PUSH DOCKER IMAGES
  # =====================================================

  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------
      # Checkout
      # -------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------
      # Login to GHCR
      # -------------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # -------------------------------------------------
      # Setup Buildx
      # -------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # =================================================
      # BUILD WEB IMAGE
      # =================================================

      - name: Build and push Pizztol Web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true

          tags: |
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ github.sha }}

          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web


      # =================================================
      # BUILD MIGRATOR IMAGE
      # =================================================

      - name: Build and push Prisma Migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true

          tags: |
            ${{ env.REGISTRY }}/${{ env.MIGRATOR_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.MIGRATOR_IMAGE }}:${{ github.sha }}

          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator


  # =====================================================
  # DEPLOY TO AWS LIGHTSAIL
  # =====================================================

  deploy:
    name: Deploy to Lightsail

    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      # -------------------------------------------------
      # SSH into Lightsail
      # -------------------------------------------------

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.LIGHTSAIL_HOST }}

          username: ${{ secrets.LIGHTSAIL_USERNAME }}

          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

          script: |

            set -e

            echo "========================================="
            echo "Starting Pizztol deployment"
            echo "========================================="


            # =================================================
            # PROJECT DIRECTORY
            # =================================================

            cd /opt/pizztol


            # =================================================
            # PULL LATEST IMAGES
            # =================================================

            echo "Pulling latest web image..."

            docker pull \
              ghcr.io/${{ github.repository_owner }}/pizztol-web:latest


            echo "Pulling latest migrator image..."

            docker pull \
              ghcr.io/${{ github.repository_owner }}/pizztol-migrator:latest


            # =================================================
            # START DATABASE
            # =================================================

            echo "Starting PostgreSQL..."

            docker compose up -d db


            # =================================================
            # WAIT FOR DATABASE
            # =================================================

            echo "Waiting for PostgreSQL..."

            until [ "$(docker inspect -f '{{.State.Health.Status}}' pizztol_db 2>/dev/null)" = "healthy" ]
            do
              echo "PostgreSQL is not ready yet..."
              sleep 3
            done


            echo "PostgreSQL is healthy."


            # =================================================
            # RUN PRISMA MIGRATIONS
            # =================================================

            echo "Running Prisma migrations..."


            docker run --rm \
              --network pizztol_network \
              --env-file /opt/pizztol/.env \
              ghcr.io/${{ github.repository_owner }}/pizztol-migrator:latest


            echo "Prisma migrations completed successfully."


            # =================================================
            # START WEB
            # =================================================

            echo "Starting Pizztol Web..."

            docker compose up -d web


            # =================================================
            # WAIT FOR WEB
            # =================================================

            echo "Waiting for Pizztol Web..."

            sleep 5


            # =================================================
            # WEB HEALTH CHECK
            # =================================================

            WEB_STATUS=$(
              docker inspect \
                -f '{{.State.Health.Status}}' \
                pizztol_web 2>/dev/null || echo "unknown"
            )

            echo "Web health status: $WEB_STATUS"


            # =================================================
            # CLEAN OLD IMAGES
            # =================================================

            echo "Cleaning unused Docker images..."

            docker image prune -f


            # =================================================
            # FINAL STATUS
            # =================================================

            echo "========================================="
            echo "Pizztol deployment completed"
            echo "========================================="

            echo "Running containers:"

            docker ps